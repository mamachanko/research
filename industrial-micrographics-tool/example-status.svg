    .wire { stroke: #27d7ff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-muted { stroke: #526579; stroke-width: 1.5; fill: none; stroke-linecap: round; }
    .accent { stroke: #8ff0ff; fill: none; }
    .txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e8f6ff; font-size: 12px; letter-spacing: .06em; }
